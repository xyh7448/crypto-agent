[project]
name = "crypto-agent"
version = "0.1.0"
description = "Crypto Quant Agent OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "openai>=1.50.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "structlog>=24.0",
    "ccxt>=4.4.0",
    "mcp>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
